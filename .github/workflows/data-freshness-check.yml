name: 데이터 최신성 체크

# 대형폐기물 수수료(공공데이터포털)와 분리배출 훈령(국가법령정보센터)을
# 매주 다시 받아서 기존에 커밋된 값과 다르면 이슈로 알린다.
# 두 API 모두 키 없이 접근 가능하다 (docs/12, docs/08). 자동으로 커밋/푸시는
# 하지 않는다 — 라이브 페이지에 반영되는 데이터라 사람이 diff를 보고 판단한다.

on:
  schedule:
    - cron: "0 0 * * 1"  # 매주 월요일 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pymupdf

      - name: 수수료 데이터 재수집
        run: |
          python scripts/fetch_fee_datasets.py
          python scripts/normalize_fees.py

      - name: 분리배출 훈령 재수집
        # 국가법령정보센터가 해외(깃헙 액션) IP에 느리거나 응답을 안 줄 수 있다.
        # 재시도 구조상 최악 15분 가까이 걸릴 수 있어 여기서 끊는다.
        timeout-minutes: 8
        continue-on-error: true
        run: |
          python scripts/fetch_env_guidelines.py
          python scripts/parse_disposal_guideline.py

      - name: 변경분 확인
        id: diff
        run: |
          # 수집일자(collected_at)가 박힌 manifest.json/fees_report.json은 뺀다.
          # 재수집할 때마다 그 필드만 바뀌어서 실제 값이 그대로여도 diff가 난다.
          # 발령일자(issued)가 진짜 신호이고, 그건 아래 두 파일이 담고 있다.
          TARGETS="data/processed/fees.csv data/guidelines/item-verdicts.csv data/guidelines/disposal-rules.json"
          # manifest.json의 collected_at(수집 시각)은 재수집할 때마다 항상 바뀐다.
          # 그 줄만 있는 diff는 "변경 없음"으로 친다 — 안 그러면 매번 오탐한다.
          # grep '^[+-][^+-]' 로 --- / +++ 파일 헤더 줄은 빼고 실제 내용 줄만 본다.
          # 이 스크립트들은 csv 모듈로 CRLF를 쓰는데 커밋된 원본은 LF다.
          # 로컬 Windows에서는 git이 자동으로 맞춰 보여서 안 드러나지만
          # 우분투 러너에서는 매 줄이 다르다고 나온다. --ignore-cr-at-eol로 무시한다.
          MEANINGFUL=$(git diff --ignore-cr-at-eol -- $TARGETS | grep -v '"collected_at"' | grep -E '^[+-][^+-]' || true)
          if [ -z "$MEANINGFUL" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "매주 자동 재수집에서 이전 커밋과 다른 값이 나왔다."
            echo ""
            echo "## 바뀐 파일"
            echo '```'
            git diff --stat -- $TARGETS
            echo '```'
            echo ""
            echo "## 상세 diff (최대 400줄)"
            echo '```diff'
            git diff -- $TARGETS | head -400
            echo '```'
            echo ""
            echo "확인 방법: 로컬에서 \`python scripts/fetch_fee_datasets.py && python scripts/normalize_fees.py\`,"
            echo "\`python scripts/fetch_env_guidelines.py && python scripts/parse_disposal_guideline.py\` 재실행 후"
            echo "\`git diff\`로 직접 보고, 맞으면 커밋한다. 이 워크플로는 감지만 하고 자동 커밋하지 않는다."
          } > /tmp/issue-body.md

      - name: 라벨 준비
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-freshness --color FBCA04 \
            --description "자동 데이터 최신성 체크" --force

      - name: 기존 미해결 이슈 확인
        if: steps.diff.outputs.changed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --label data-freshness --state open --json number -q '.[0].number // empty')
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: 이슈 갱신 또는 생성
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ steps.existing.outputs.number }}
        run: |
          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --body-file /tmp/issue-body.md
          else
            gh issue create \
              --title "수수료/훈령 데이터 변경 감지 $(date +%Y-%m-%d)" \
              --label data-freshness \
              --body-file /tmp/issue-body.md
          fi
