name: IndexNow 제출

# 품목/가이드 페이지가 새로 배포되면 IndexNow로 URL을 재통지한다
# (빙, 얀덱스, 네이버, 세즈남, 옙 일괄 통지). 구글은 IndexNow 미참여라
# 별도(scripts/indexing_queue.py, 사람이 손으로 하루 할당량만큼).
# 사이트맵을 매번 통째로 재제출하는 구조라 여러 번 쏴도 손해가 없다.

on:
  push:
    branches: [main]
    paths:
      - "site/src/content/items/**"
      - "site/src/content/guides/**"
      - "site/src/data/items.json"
  schedule:
    - cron: "0 0 * * 1"  # 매주 월요일 09:00 KST, 놓친 경우의 안전망
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 배포 반영 대기
        # 푸시 직후라 Vercel 빌드가 아직 안 끝났을 수 있다. 사이트맵이
        # 이전 배포 것이면 새 URL이 빠진 채로 나간다. 매주 cron은 이미
        # 안정된 상태를 읽는 것이라 기다릴 필요 없다.
        if: github.event_name == 'push'
        run: sleep 180

      - name: IndexNow 제출
        run: python scripts/indexnow_submit.py

      - name: 제출 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indexing/indexnow_log.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: IndexNow 제출 기록 (자동, $GITHUB_EVENT_NAME)"
          git push
