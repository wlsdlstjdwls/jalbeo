<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="잘버려">
  <!-- 잘버려 마크. 사이트와 같은 문법이다 - 라운드 없음, 굵은 테두리, 라임 한 덩어리.
       통에 넣는 동작만 남겼다. 16px에서도 형태가 무너지지 않게 면으로만 그렸다. -->
  <rect width="64" height="64" fill="#c9f24d"/>
  <rect x="3" y="3" width="58" height="58" fill="none" stroke="#111" stroke-width="6"/>
  <rect x="29" y="10" width="6" height="11" fill="#111"/>
  <polygon points="22,19 42,19 32,31" fill="#111"/>
  <rect x="15" y="34" width="34" height="5" fill="#111"/>
  <polygon points="19,42 45,42 42,55 22,55" fill="#111"/>
</svg>
